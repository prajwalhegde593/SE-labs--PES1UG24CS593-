      .dependency { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 8 6; marker-end: url(#open-arrow); }
      .stereotype { font: italic 13px Arial, sans-serif; fill: #000000; paint-order: stroke; stroke: #FFFFFF; stroke-width: 5px; stroke-linejoin: round; }
      .condition { font: 11.5px Arial, sans-serif; fill: #444444; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; }
      .footer { font: 12px Arial, sans-serif; fill: #000000; }
